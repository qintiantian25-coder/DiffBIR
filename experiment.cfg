experiment:
  stage: 1
  stage1:
    train_config_path: configs/train/blind_train_stage1.yaml
    test:
      # 输入为 test_blur，输出目录会在推理后写入结果
      input_dir: /home/student_server/Qtt/NAFNet/data/test_blur
      output_dir: ./outputs/stage1_test
      device: cuda
      precision: fp16
      batch_size: 1
      n_samples: 1
      # 下面三个用于盲元评估，若不需要可保留但不会执行
      blind_eval:
        gt_dir: /home/student_server/Qtt/NAFNet/data/test_sharp
        dataset_path: /home/student_server/Qtt/NAFNet/data
        save_dir: ./outputs/stage1_metrics
        test_mask_csv: /home/student_server/Qtt/NAFNet/data/test_mask/blind_pixel_coords.csv

  stage2:
    train_config_path: configs/train/blind_train_stage2.yaml
    test:
      # stage 2 使用 custom 推理入口，需要指定训练配置和 checkpoint
      input_dir: /home/student_server/Qtt/NAFNet/data/test_blur
      output_dir: ./outputs/stage2_test
      device: cuda
      precision: fp16
      batch_size: 1
      n_samples: 1
      version: custom
      ckpt: ./experiments/blind_stage2/checkpoints/latest.pt
      train_cfg: configs/train/blind_train_stage2.yaml
      captioner: none
      task: denoise
      blind_eval:
        gt_dir: /home/student_server/Qtt/NAFNet/data/test_sharp
        dataset_path: /home/student_server/Qtt/NAFNet/data
        save_dir: ./outputs/stage2_metrics
        test_mask_csv: /home/student_server/Qtt/NAFNet/data/test_mask/blind_pixel_coords.csv
